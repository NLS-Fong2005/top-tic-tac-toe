<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,circle" />
</head>
<body>
  <div class="left-lane">
    <h1 class="playerOne"></h1>
    <h2 class="playerOneWins">W:</h2>
    <h2 class="playerOneLosses">L:</h2>
  </div>
  <div class="middle-lane">
    <h1>Tic-Tac-Toe</h1>
    <div class="board">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>

    <button command="show-modal" commandfor="playerCreator">Start Game</button>
    <dialog id="playerCreator">
      <div>
        <form action="" method="dialog" name="playerCreator">
          <label for="playerOne">Player One Name</label>
          <input type="text" name="playerOne" id="playerOne" required>
          
          <label for="playerTwo">Player Two Name</label>
          <input type="text" name="playerTwo" id="playerTwo" required>

          <div class="button-group">
            <button value="save">Start</button>
            <button value="cancel" formnovalidate>Cancel</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="newGameDialog">
      <div>
        <h1 class="winningHeader"></h1>
        <button class="newGameButton">Start New Game</button>
      </div>
    </dialog>

  </div>

  <div class="right-lane">
    <h1 class="playerTwo"></h1>
    <h2 class="playerTwoWins">W:</h2>
    <h2 class="playerTwoLosses">L:</h2>
  </div>
</body>
<footer>
  <!-- * Make changes and re-implement after ui is finished -->
  <script src="./assets/script.js"></script>
</footer>
</html>
