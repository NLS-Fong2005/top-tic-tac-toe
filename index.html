<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,circle" />
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div class="board">
    <div class="cell">
     <span class="material-symbols-outlined cross">close</span> 
    </div>
    <div class="cell">
      <span class="material-symbols-outlined circle">circle</span>
    </div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>

  <button command="show-modal" commandfor="playerCreator">Start Game</button>
  <dialog id="playerCreator">
    <div>
      <form action="" method="dialog" name="playerCreator">
        <label for="playerOne">Player One Name</label>
        <input type="text" name="playerOne" id="playerOne" required>
        
        <label for="playerTwo">Player Two Name</label>
        <input type="text" name="playerTwo" id="playerTwo" required>

        <div class="buttonGroup">
          <button value="save">Start</button>
          <button value="cancel" formnovalidate>Cancel</button>
        </div>
      </form>
    </div>
    
  </dialog>
</body>
<footer>
  <!-- * Make changes and re-implement after ui is finished -->
  <!-- <script src="./assets/script.js"></script> -->
</footer>
</html>
