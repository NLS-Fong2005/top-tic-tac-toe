<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div class="board">
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>

  <button command="show-modal" commandfor="playerCreator">Start Game</button>
  
  <dialog id="playerCreator">
    <form method="dialog" name="playerCreator">
      <label for="player">Player Name</label>
      <input type="text" name="playerName" id="playerName" required>
    </form>
  </dialog>
</body>

</footer>
</html>
